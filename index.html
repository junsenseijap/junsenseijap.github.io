<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jun Sensei — 日本語</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&family=Zen+Antique+Soft&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    :root {
      /* ── Palette Jun Sensei — Hanami clair ── */
      --pink:         #E84B7A;     /* rose vif principal (image) */
      --pink-mid:     #F07099;     /* rose moyen */
      --pink-soft:    #F9C0D0;     /* rose pâle pastel */
      --pink-pale:    #FDE8EF;     /* rose très pâle (fond cartes) */
      --pink-glow:    rgba(232,75,122,0.15);
      --blue:         #7BAFD4;     /* bleu ciel pastel */
      --blue-pale:    #D6EBF7;     /* bleu très pâle */
      --blue-soft:    rgba(123,175,212,0.18);
      --peach:        #FBD5C5;     /* pêche pastel */
      --sage:         #9EC4A0;     /* vert sauge doux */
      --gold:         #C89B3C;
      --gold-lt:      #E0B86A;
      /* ── Neutres clairs ── */
      --bg:           #FAFAFA;     /* fond principal blanc cassé */
      --bg-card:      #FFFFFF;
      --bg-soft:      #F5F0F3;     /* fond légèrement rosé */
      --border:       rgba(232,75,122,0.15);
      --border-blue:  rgba(123,175,212,0.25);
      --ink:          #2C1A22;     /* texte foncé prune */
      --ink2:         #5A3D4A;     /* texte secondaire */
      --gray:         #9A8590;
      --shadow:       rgba(44,26,34,0.1);
      --shadow-pink:  rgba(232,75,122,0.18);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── BACKGROUND — très subtil ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 5% 0%, rgba(249,192,208,0.35) 0%, transparent 55%),
        radial-gradient(ellipse 40% 35% at 98% 5%, rgba(123,175,212,0.2) 0%, transparent 50%),
        radial-gradient(ellipse 50% 50% at 50% 110%, rgba(249,192,208,0.2) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }

    /* ── PÉTALES DE SAKURA ── */
    .petals-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0; overflow: hidden;
    }
    .petal {
      position: absolute;
      background: radial-gradient(ellipse at 40% 35%, rgba(249,192,208,0.95), rgba(232,75,122,0.3));
      border-radius: 80% 0 55% 0 / 55% 0 80% 0;
      animation: petalFall linear infinite;
      opacity: 0;
    }
    .petal:nth-child(1)  { left:6%;  width:10px; height:8px;  animation-duration:16s; animation-delay:-2s; }
    .petal:nth-child(2)  { left:20%; width:13px; height:10px; animation-duration:20s; animation-delay:-8s; }
    .petal:nth-child(3)  { left:35%; width:8px;  height:6px;  animation-duration:13s; animation-delay:-1s; }
    .petal:nth-child(4)  { left:55%; width:11px; height:9px;  animation-duration:18s; animation-delay:-10s; }
    .petal:nth-child(5)  { left:68%; width:9px;  height:7px;  animation-duration:22s; animation-delay:-5s; }
    .petal:nth-child(6)  { left:80%; width:12px; height:9px;  animation-duration:17s; animation-delay:-14s; }
    .petal:nth-child(7)  { left:90%; width:8px;  height:6px;  animation-duration:15s; animation-delay:-7s; }
    .petal:nth-child(8)  { left:44%; width:10px; height:8px;  animation-duration:19s; animation-delay:-3s; }

    @keyframes petalFall {
      0%   { transform: translateY(-20px) rotate(0deg) translateX(0); opacity: 0; }
      5%   { opacity: 0.8; }
      80%  { opacity: 0.5; }
      100% { transform: translateY(110vh) rotate(480deg) translateX(50px); opacity: 0; }
    }

    /* ── LAYOUT ── */
    #app { position: relative; z-index: 1; min-height: 100vh; }

    /* ══════════════════════════════════════
       LOGIN PAGE
    ══════════════════════════════════════ */
    #page-login {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; padding: 2rem;
    }

    .login-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 3rem 2.5rem;
      width: 100%; max-width: 400px;
      box-shadow: 0 4px 40px var(--shadow-pink), 0 1px 4px var(--shadow);
      animation: fadeUp 0.6s cubic-bezier(.22,.68,0,1.2) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-logo { text-align: center; margin-bottom: 2.4rem; }

    .login-logo .cherry-icon {
      display: block; margin: 0 auto 0.8rem;
      font-size: 2.4rem; line-height: 1;
      animation: bloomIn 0.7s 0.15s both;
    }
    @keyframes bloomIn {
      from { opacity: 0; transform: scale(0.3) rotate(-20deg); }
      to   { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    .login-logo .jp-title {
      font-family: 'Zen Antique Soft', serif;
      font-size: 2.5rem; font-weight: 400;
      color: var(--pink);
      letter-spacing: 0.1em;
      display: block;
    }
    .login-logo .en-title {
      font-size: 0.68rem; letter-spacing: 0.38em;
      text-transform: uppercase; color: var(--ink2);
      font-weight: 400; display: block; margin-top: 0.35rem;
    }
    .login-logo .tagline {
      font-size: 0.72rem; color: var(--gray);
      font-style: italic; display: block; margin-top: 0.3rem;
    }
    .login-logo .divider {
      width: 70px; height: 2px; margin: 1rem auto;
      background: linear-gradient(90deg, transparent, var(--pink-soft), var(--pink), var(--pink-soft), transparent);
      border-radius: 2px;
    }

    .form-group { margin-bottom: 1.3rem; }
    .form-group label {
      display: block; font-size: 0.68rem;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--ink2); margin-bottom: 0.5rem; font-weight: 500;
    }
    .form-group input {
      width: 100%; padding: 0.85rem 1rem;
      background: var(--bg-soft);
      border: 1.5px solid rgba(232,75,122,0.2);
      border-radius: 10px; color: var(--ink);
      font-size: 1rem; font-family: 'DM Sans', sans-serif;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      outline: none;
    }
    .form-group input:focus {
      border-color: var(--pink);
      background: #fff;
      box-shadow: 0 0 0 3px var(--pink-glow);
    }
    .form-group input::placeholder { color: var(--gray); opacity: 0.6; }

    .btn-login {
      width: 100%; padding: 0.95rem;
      background: linear-gradient(135deg, var(--pink) 0%, var(--pink-mid) 100%);
      border: none; color: white; font-size: 0.78rem;
      letter-spacing: 0.28em; text-transform: uppercase;
      font-weight: 500; cursor: pointer;
      border-radius: 10px; margin-top: 0.5rem;
      transition: opacity 0.2s, transform 0.12s, box-shadow 0.2s;
      font-family: 'DM Sans', sans-serif;
      box-shadow: 0 4px 18px rgba(232,75,122,0.35);
    }
    .btn-login:hover {
      opacity: 0.9;
      box-shadow: 0 7px 26px rgba(232,75,122,0.45);
    }
    .btn-login:active { transform: scale(0.98); }

    .login-error {
      background: var(--pink-pale);
      border: 1px solid rgba(232,75,122,0.3);
      border-radius: 8px; padding: 0.7rem 1rem;
      font-size: 0.83rem; color: var(--pink);
      margin-top: 1rem; display: none; text-align: center;
    }

    /* ══════════════════════════════════════
       HEADER
    ══════════════════════════════════════ */
    #header {
      display: none;
      position: sticky; top: 0; z-index: 100;
      background: rgba(250,250,250,0.95);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
      padding: 0.8rem 2rem;
      flex-direction: row; align-items: center; justify-content: space-between;
      box-shadow: 0 1px 12px var(--shadow-pink);
    }

    .header-logo {
      font-family: 'Zen Antique Soft', serif;
      font-size: 1.2rem; color: var(--pink); font-weight: 400;
      letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.5rem;
    }
    .header-logo .cherry-sm { font-size: 1rem; }
    .header-logo-sub {
      font-size: 0.6rem; letter-spacing: 0.2em; color: var(--gray);
      display: block; font-family: 'DM Sans', sans-serif; font-weight: 300;
      text-transform: uppercase;
    }

    .header-user { display: flex; align-items: center; gap: 0.9rem; }
    .header-user .user-name { font-size: 0.84rem; color: var(--ink2); }

    .role-badge {
      font-size: 0.6rem; letter-spacing: 0.15em;
      padding: 0.22rem 0.7rem; border-radius: 99px;
      text-transform: uppercase; font-weight: 600;
    }
    .role-badge.admin   {
      background: linear-gradient(135deg, var(--pink), var(--pink-mid));
      color: white;
    }
    .role-badge.student {
      background: var(--blue-pale); color: #4a8ab0;
      border: 1px solid var(--border-blue);
    }

    .btn-logout {
      background: transparent; border: 1.5px solid var(--border);
      color: var(--gray); font-size: 0.7rem; padding: 0.38rem 0.85rem;
      border-radius: 8px; cursor: pointer; letter-spacing: 0.1em;
      text-transform: uppercase; transition: all 0.2s; font-family: 'DM Sans', sans-serif;
    }
    .btn-logout:hover { border-color: var(--pink); color: var(--pink); }

    /* ══════════════════════════════════════
       MAIN PAGES
    ══════════════════════════════════════ */
    #page-student, #page-admin {
      display: none; padding: 2.5rem 2rem; max-width: 1100px; margin: 0 auto;
    }

    .page-title {
      font-family: 'Zen Antique Soft', serif;
      font-size: 1.85rem; font-weight: 400;
      color: var(--ink); margin-bottom: 0.3rem;
    }
    .page-subtitle {
      font-size: 0.7rem; letter-spacing: 0.24em;
      text-transform: uppercase; color: var(--pink);
      margin-bottom: 2.5rem;
    }

    /* ── CONTENT GRID ── */
    .content-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(248px, 1fr));
      gap: 1.2rem;
    }

    .content-card {
      background: var(--bg-card);
      border: 1.5px solid rgba(232,75,122,0.12);
      border-radius: 14px; padding: 1.4rem;
      transition: border-color 0.25s, transform 0.25s, box-shadow 0.25s;
      animation: fadeUp 0.4s ease both;
      box-shadow: 0 2px 12px rgba(232,75,122,0.06);
    }
    .content-card:hover {
      border-color: rgba(232,75,122,0.35);
      transform: translateY(-4px);
      box-shadow: 0 10px 32px rgba(232,75,122,0.14);
    }

    .card-type {
      display: inline-block;
      font-size: 0.58rem; letter-spacing: 0.2em; text-transform: uppercase;
      padding: 0.2rem 0.65rem; border-radius: 99px; margin-bottom: 0.8rem;
      font-weight: 600;
    }
    .type-audio { background: rgba(158,196,160,0.25); color: #4a8a55; border: 1px solid rgba(158,196,160,0.6); }
    .type-video { background: var(--blue-pale);        color: #3a7aaa; border: 1px solid var(--border-blue); }
    .type-pdf   { background: var(--pink-pale);        color: var(--pink); border: 1px solid rgba(232,75,122,0.25); }
    .type-image { background: #ede8f5;                 color: #7a5aa0; border: 1px solid #c8b8e0; }

    .card-title {
      font-family: 'Zen Antique Soft', serif;
      font-size: 1rem; font-weight: 400;
      color: var(--ink); margin-bottom: 0.4rem; line-height: 1.45;
    }
    .card-meta { font-size: 0.73rem; color: var(--gray); margin-bottom: 1.2rem; }
    .card-meta span { margin-right: 0.8rem; }

    .btn-view {
      display: inline-block; width: 100%;
      padding: 0.62rem 1rem; text-align: center;
      background: var(--pink-pale);
      border: 1.5px solid rgba(232,75,122,0.3);
      color: var(--pink); font-size: 0.72rem; letter-spacing: 0.16em;
      text-transform: uppercase; border-radius: 8px; cursor: pointer;
      text-decoration: none; transition: all 0.2s; font-family: 'DM Sans', sans-serif;
      font-weight: 500;
    }
    .btn-view:hover {
      background: linear-gradient(135deg, var(--pink), var(--pink-mid));
      color: white; border-color: transparent;
      box-shadow: 0 4px 16px rgba(232,75,122,0.3);
    }

    .empty-state { text-align: center; padding: 4rem 2rem; color: var(--gray); }
    .empty-state .jp {
      font-family: 'Zen Antique Soft', serif; font-size: 3.5rem;
      color: var(--pink-soft); display: block; margin-bottom: 1rem;
    }
    .empty-state p { font-size: 0.88rem; line-height: 1.7; }

    /* ══════════════════════════════════════
       ADMIN PANEL
    ══════════════════════════════════════ */
    .admin-layout {
      display: grid; grid-template-columns: 280px 1fr; gap: 1.4rem;
    }
    @media (max-width: 768px) { .admin-layout { grid-template-columns: 1fr; } }

    .panel {
      background: var(--bg-card);
      border: 1.5px solid rgba(232,75,122,0.12);
      border-radius: 14px; overflow: hidden;
      box-shadow: 0 2px 14px rgba(232,75,122,0.06);
    }
    .panel-header {
      background: linear-gradient(135deg, var(--pink-pale), var(--blue-pale));
      border-bottom: 1px solid rgba(232,75,122,0.12);
      padding: 0.9rem 1.2rem;
      font-size: 0.66rem; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--ink2); font-weight: 600;
    }

    .student-list { list-style: none; }
    .student-item {
      padding: 0.85rem 1.2rem;
      border-bottom: 1px solid rgba(44,26,34,0.05);
      cursor: pointer; transition: background 0.15s;
      display: flex; align-items: center; gap: 0.8rem;
    }
    .student-item:hover { background: var(--pink-pale); }
    .student-item.active {
      background: linear-gradient(135deg, var(--pink-pale), rgba(123,175,212,0.1));
      border-left: 3px solid var(--pink);
    }

    .student-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: linear-gradient(135deg, var(--pink-soft), var(--blue-pale));
      border: 1.5px solid rgba(232,75,122,0.3);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Zen Antique Soft', serif; font-size: 0.9rem;
      color: var(--pink); flex-shrink: 0;
    }
    .student-info { flex: 1; min-width: 0; }
    .student-name { font-size: 0.88rem; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .student-id { font-size: 0.67rem; color: var(--gray); }

    .admin-right { display: flex; flex-direction: column; gap: 1.2rem; }

    .selected-student-info {
      padding: 1.3rem 1.2rem;
      border-bottom: 1px solid rgba(232,75,122,0.1);
      background: linear-gradient(135deg, rgba(253,232,239,0.5), rgba(214,235,247,0.3));
    }
    .selected-name {
      font-family: 'Zen Antique Soft', serif;
      font-size: 1.3rem; font-weight: 400; color: var(--ink);
    }
    .selected-sub { font-size: 0.72rem; color: var(--gray); margin-top: 0.2rem; }

    .content-manage-list { list-style: none; padding: 0.4rem 0; }
    .content-manage-item {
      padding: 0.7rem 1.2rem;
      border-bottom: 1px solid rgba(44,26,34,0.04);
      display: flex; align-items: center; gap: 0.8rem;
    }
    .content-manage-item:last-child { border-bottom: none; }
    .content-manage-info { flex: 1; min-width: 0; }
    .content-manage-title { font-size: 0.87rem; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .content-manage-meta { font-size: 0.67rem; color: var(--gray); margin-top: 0.12rem; }

    .btn-unlock {
      padding: 0.38rem 0.85rem; border-radius: 99px; cursor: pointer;
      font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase;
      font-family: 'DM Sans', sans-serif; font-weight: 600; flex-shrink: 0;
      transition: all 0.18s; border: 1.5px solid;
    }
    .btn-unlock.locked  { background: rgba(158,196,160,0.15); border-color: rgba(74,138,85,0.4); color: #4a8a55; }
    .btn-unlock.locked:hover  { background: rgba(158,196,160,0.3); }
    .btn-unlock.unlocked { background: var(--pink-pale); border-color: rgba(232,75,122,0.35); color: var(--pink); }
    .btn-unlock.unlocked:hover { background: rgba(232,75,122,0.12); }

    .unlock-status { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .unlock-status.on  { background: #4a8a55; box-shadow: 0 0 5px rgba(74,138,85,0.5); }
    .unlock-status.off { background: rgba(44,26,34,0.12); }

    /* ── LOADING ── */
    .loading { text-align: center; padding: 3rem; color: var(--gray); font-size: 0.84rem; }
    .spinner {
      width: 26px; height: 26px; margin: 0 auto 1rem;
      border: 2px solid var(--pink-soft);
      border-top-color: var(--pink);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── TOAST ── */
    #toast {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px);
      background: var(--bg-card); border: 1.5px solid rgba(232,75,122,0.3);
      color: var(--ink); padding: 0.8rem 1.6rem; border-radius: 10px;
      font-size: 0.84rem; z-index: 999; transition: transform 0.3s ease;
      box-shadow: 0 6px 24px var(--shadow-pink); white-space: nowrap;
    }
    #toast.show    { transform: translateX(-50%) translateY(0); }
    #toast.success { border-color: rgba(74,138,85,0.5); }
    #toast.error   { border-color: rgba(232,75,122,0.5); }

    /* ── RESPONSIVE ── */
    @media (max-width: 500px) {
      .login-box { padding: 2rem 1.5rem; }
      #page-student, #page-admin { padding: 1.5rem 1rem; }
      #header { padding: 0.75rem 1rem; }
    }

    /* ══════════════════════════════════════
       LANGUAGE BAR
    ══════════════════════════════════════ */
    #lang-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      background: rgba(250,250,250,0.97);
      border-bottom: 1px solid rgba(232,75,122,0.12);
      backdrop-filter: blur(14px);
      display: flex; justify-content: center; align-items: center;
      gap: 0.2rem; padding: 0.35rem 1rem;
      box-shadow: 0 1px 8px rgba(232,75,122,0.07);
    }
    .lang-btn {
      background: transparent; border: none; cursor: pointer;
      font-family: 'DM Sans', sans-serif; font-size: 0.7rem;
      font-weight: 500; letter-spacing: 0.08em;
      padding: 0.28rem 0.75rem; border-radius: 99px;
      color: var(--gray); transition: all 0.18s;
      display: flex; align-items: center; gap: 0.35rem;
    }
    .lang-btn .flag { font-size: 0.9rem; line-height: 1; }
    .lang-btn:hover { color: var(--pink); background: var(--pink-pale); }
    .lang-btn.active {
      color: var(--pink); background: var(--pink-pale);
      border: 1.5px solid rgba(232,75,122,0.25);
      font-weight: 600;
    }
    .lang-sep {
      color: rgba(232,75,122,0.2); font-size: 0.7rem; user-select: none;
    }

    /* push all pages down to account for lang-bar (~36px) */
    #page-login { padding-top: calc(2rem + 36px); }
    #header { top: 36px; }
    #page-student, #page-admin { padding-top: calc(2.5rem + 36px); }
    @media (max-width: 500px) {
      #page-login { padding-top: calc(1.5rem + 36px); }
      #page-student, #page-admin { padding-top: calc(1.5rem + 36px); }
    }
  </style>
</head>
<body>

<!-- ══ LANGUAGE BAR ══ -->
<div id="lang-bar">
  <button class="lang-btn active" onclick="setLang('vi')" id="lang-vi">
    <span class="flag">🇻🇳</span> Tiếng Việt
  </button>
  <span class="lang-sep">|</span>
  <button class="lang-btn" onclick="setLang('ja')" id="lang-ja">
    <span class="flag">🇯🇵</span> 日本語
  </button>
  <span class="lang-sep">|</span>
  <button class="lang-btn" onclick="setLang('en')" id="lang-en">
    <span class="flag">🇬🇧</span> English
  </button>
  <span class="lang-sep">|</span>
  <button class="lang-btn" onclick="setLang('fr')" id="lang-fr">
    <span class="flag">🇫🇷</span> Français
  </button>
</div>


<!-- Pétales de sakura -->
<div class="petals-bg">
  <div class="petal"></div><div class="petal"></div><div class="petal"></div>
  <div class="petal"></div><div class="petal"></div><div class="petal"></div>
  <div class="petal"></div><div class="petal"></div>
</div>

<div id="app">

  <!-- ══ LOGIN ══ -->
  <div id="page-login">
    <div class="login-box">
      <div class="login-logo">
        <span class="cherry-icon">🌸</span>
        <span class="jp-title">ジュン先生</span>
        <div class="divider"></div>
        <span class="en-title">Jun Sensei · Học Tiếng Nhật</span>
        <span class="tagline">Lớp tiếng Nhật tư duy &amp; tự giác</span>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxfQk0DHlw4Q8lWwLm0TDoqxEZiuBRDMsUCFLh-n4NpugzYhKPrcoHuvSbolzVvHZFsJw/exec";
const SESSION_KEY = "jun_session";
const SESSION_DAYS = 90;

function saveSession(user) {
  const expiry = Date.now() + SESSION_DAYS * 24 * 60 * 60 * 1000;
  localStorage.setItem(SESSION_KEY, JSON.stringify({ user, expiry }));
}
function loadSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const { user, expiry } = JSON.parse(raw);
    if (Date.now() > expiry) { localStorage.removeItem(SESSION_KEY); return null; }
    return user;
  } catch { return null; }
}
function clearSession() { localStorage.removeItem(SESSION_KEY); }

async function api(params) {
  const url = API_URL + "?" + new URLSearchParams(params).toString();
  const res = await fetch(url);
  return res.json();
}

function toast(msg, type = "success") {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "show " + type;
  setTimeout(() => { el.className = ""; }, 3000);
}

function showPage(name) {
  document.getElementById("page-login").style.display   = name === "login"   ? "flex"  : "none";
  document.getElementById("page-student").style.display = name === "student" ? "block" : "none";
  document.getElementById("page-admin").style.display   = name === "admin"   ? "block" : "none";
  document.getElementById("header").style.display       = name !== "login"   ? "flex"  : "none";
}

async function doLogin() {
  const phone = document.getElementById("input-id").value.trim();
  const pin   = document.getElementById("input-pin").value.trim();
  const err   = document.getElementById("login-error");
  const btn   = document.getElementById("btn-login");
  if (!phone || !pin) { showError(t("loginErrEmpty")); return; }
  btn.textContent = "..."; btn.disabled = true;
  err.style.display = "none";
  try {
    const data = await api({ action: "login", phone, pin });
    if (data.success) {
      if (data.user.role === "Admin") window._adminPin = pin;
      saveSession(data.user);
      initUser(data.user);
    } else {
      showError(data.message || t("loginErrWrong"));
    }
  } catch (e) {
    showError(t("loginErrConn"));
  }
  btn.textContent = t("loginBtn"); btn.disabled = false;
}

function showError(msg) {
  const err = document.getElementById("login-error");
  err.textContent = msg; err.style.display = "block";
}

document.getElementById("input-pin").addEventListener("keydown", e => {
  if (e.key === "Enter") doLogin();
});

function initUser(user) {
  document.getElementById("header-name").textContent = user.name + " " + (user.familyName || "");
  const roleEl = document.getElementById("header-role");
  roleEl.textContent = user.role;
  roleEl.className = "role-badge " + (user.role === "Admin" ? "admin" : "student");
  if (user.role === "Admin") { showPage("admin"); loadAdminPanel(user); }
  else { showPage("student"); loadStudentContent(user); }
}

function doLogout() {
  clearSession(); window._adminPin = undefined;
  document.getElementById("input-id").value = "";
  document.getElementById("input-pin").value = "";
  document.getElementById("login-error").style.display = "none";
  showPage("login");
}

async function loadStudentContent(user) {
  document.getElementById("student-greeting").textContent =
    t("studentGreeting", user.name || "");
  const wrap = document.getElementById("content-grid-wrap");
  wrap.innerHTML = '<div class="loading"><div class="spinner"></div>' + t("loadingContent") + '</div>';
  try {
    const data = await api({ action: "getMyContent", studentId: user.id });
    if (!data.success) {
      wrap.innerHTML = '<div class="empty-state"><span class="jp">無</span><p>' + t("errContent") + '</p></div>';
      return;
    }
    if (!data.content || data.content.length === 0) {
      wrap.innerHTML = '<div class="empty-state"><span class="jp">待</span><p>' + t("emptyContent") + '</p></div>';
      return;
    }
    wrap.innerHTML = '<div class="content-grid">' + data.content.map(renderContentCard).join("") + '</div>';
  } catch (e) {
    wrap.innerHTML = '<div class="empty-state"><span class="jp">×</span><p>' + t("errConn") + '</p></div>';
  }
}

function renderContentCard(c) {
  const typeClass = "type-" + (c.type || "pdf").toLowerCase();
  const typeLabel = (c.type || "").toUpperCase();
  const meta = [c.level, c.courseN ? t("lessonLabel") + " " + c.courseN : ""].filter(Boolean).join(" · ");
  const date = c.unlockedDate ? "🌸 " + (currentLang === "fr" ? "Débloqué le" : currentLang === "ja" ? "解除日" : currentLang === "en" ? "Unlocked" : "Mở khoá") + ": " + c.unlockedDate : "";
  return `
    <div class="content-card">
      <span class="card-type ${typeClass}">${typeLabel}</span>
      <div class="card-title">${c.title || "Nội dung"}</div>
      <div class="card-meta">
        <span>${meta}</span><br>
        <span style="color:var(--pink);opacity:0.65;font-size:0.7rem;">${date}</span>
      </div>
      <a class="btn-view" href="${c.driveLink}" target="_blank" rel="noopener">${t('viewBtn')}</a>
    </div>`;
}

let adminUser = null, allContent = [], selectedStudentId = null, studentAccessMap = {};

async function loadAdminPanel(user) {
  adminUser = user;
  const list = document.getElementById("student-list");
  list.innerHTML = '<li class="loading"><div class="spinner"></div>' + t("loadingStudents") + '</li>';
  try {
    const [studentsData, contentData] = await Promise.all([
      api({ action: "getStudents",   adminId: user.id, pin: getStoredPin() }),
      api({ action: "getAllContent", adminId: user.id, pin: getStoredPin() })
    ]);
    allContent = contentData.success ? contentData.content : [];
    if (!studentsData.success) {
      list.innerHTML = '<li style="padding:1rem;color:var(--gray);font-size:0.84rem">' + t("errStudents") + '</li>';
      return;
    }
    const students = studentsData.students || [];
    if (students.length === 0) {
      list.innerHTML = '<li style="padding:1rem;color:var(--gray);font-size:0.84rem">' + t("noStudents") + '</li>';
      return;
    }
    list.innerHTML = students.map(s => `
      <li class="student-item" onclick="selectStudent(${s.id}, '${s.name}', '${s.familyName}')" id="stu-${s.id}">
        <div class="student-avatar">${(s.name || "?")[0]}</div>
        <div class="student-info">
          <div class="student-name">${s.name} ${s.familyName || ""}</div>
          <div class="student-id">ID: ${s.id}</div>
        </div>
      </li>`).join("");
  } catch (e) {
    list.innerHTML = '<li style="padding:1rem;color:var(--gray);font-size:0.84rem">' + t("errConn") + '</li>';
  }
}

function getStoredPin() { return window._adminPin || ""; }

async function selectStudent(id, name, familyName) {
  selectedStudentId = id;
  document.querySelectorAll(".student-item").forEach(el => el.classList.remove("active"));
  const el = document.getElementById("stu-" + id);
  if (el) el.classList.add("active");
  const panel = document.getElementById("admin-content-panel");
  panel.innerHTML = `
    <div class="panel-header">${t("contentHeader")}</div>
    <div class="selected-student-info">
      <div class="selected-name">${name} ${familyName}</div>
      <div class="selected-sub">ID: ${id}</div>
    </div>
    <div class="loading"><div class="spinner"></div>${t("loadingStudents")}</div>`;
  try {
    const data = await api({ action: "getMyContent", studentId: id });
    const unlocked = new Set((data.content || []).map(c => String(c.id)));
    studentAccessMap[id] = unlocked;
    renderContentManage(id, name, familyName, unlocked);
  } catch {
    panel.innerHTML += '<div style="padding:1rem;color:var(--gray)">' + t('errConn') + '</div>';
  }
}

function renderContentManage(studentId, name, familyName, unlocked) {
  const panel = document.getElementById("admin-content-panel");
  const items = allContent.map(c => {
    const isUnlocked = unlocked.has(String(c.id));
    const typeClass  = "type-" + (c.type || "pdf").toLowerCase();
    return `
      <li class="content-manage-item">
        <div class="unlock-status ${isUnlocked ? 'on' : 'off'}"></div>
        <div class="content-manage-info">
          <div class="content-manage-title">${c.title}</div>
          <div class="content-manage-meta">
            <span class="card-type ${typeClass}" style="font-size:0.52rem;padding:0.1rem 0.4rem">${(c.type||'').toUpperCase()}</span>
            ${c.level || ''} · Bài ${c.courseN || '?'}
          </div>
        </div>
        <button class="btn-unlock ${isUnlocked ? 'unlocked' : 'locked'}"
          id="btn-c-${c.id}"
          onclick="toggleContent(${studentId}, ${c.id}, ${isUnlocked})">
          ${isUnlocked ? t('btnLock') : t('btnUnlock')}
        </button>
      </li>`;
  }).join("");
  panel.innerHTML = `
    <div class="panel-header">${t("contentHeader")}</div>
    <div class="selected-student-info">
      <div class="selected-name">${name} ${familyName}</div>
      <div class="selected-sub">ID: ${studentId} · ${t("unlockedCount", unlocked.size)}</div>
    </div>
    ${allContent.length === 0
      ? '<div style="padding:2rem;text-align:center;color:var(--gray);font-size:0.84rem">' + t("noContentSheet") + '</div>'
      : '<ul class="content-manage-list">' + items + '</ul>'
    }`;
}

async function toggleContent(studentId, contentId, isCurrentlyUnlocked) {
  const btn = document.getElementById("btn-c-" + contentId);
  if (btn) { btn.disabled = true; btn.textContent = "..."; }
  const action = isCurrentlyUnlocked ? "lockContent" : "unlockContent";
  try {
    const data = await api({ action, adminId: adminUser.id, pin: getStoredPin(), studentId, contentId });
    if (data.success) {
      toast(data.message, "success");
      const accessData = await api({ action: "getMyContent", studentId });
      const unlocked = new Set((accessData.content || []).map(c => String(c.id)));
      studentAccessMap[studentId] = unlocked;
      const el = document.querySelector(`#stu-${studentId} .student-name`);
      const parts = el ? el.textContent.trim().split(" ") : ["", ""];
      renderContentManage(studentId, parts[0], parts.slice(1).join(" "), unlocked);
    } else {
      toast(data.message || t("errToggle"), "error");
      if (btn) { btn.disabled = false; btn.textContent = isCurrentlyUnlocked ? t('btnLock') : t('btnUnlock'); }
    }
  } catch {
    toast(t("errToggle"), "error");
    if (btn) { btn.disabled = false; btn.textContent = isCurrentlyUnlocked ? t('btnLock') : t('btnUnlock'); }
  }
}

const LANG_KEY = "jun_lang";
let currentLang = localStorage.getItem(LANG_KEY) || "vi";

function t(key, ...args) {
  const dict = TRANSLATIONS[currentLang] || TRANSLATIONS.vi;
  const val = dict[key];
  if (typeof val === "function") return val(...args);
  return val || key;
}

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem(LANG_KEY, lang);

  // Update active button
  ["vi","ja","en","fr"].forEach(l => {
    const btn = document.getElementById("lang-" + l);
    if (btn) btn.classList.toggle("active", l === lang);
  });

  // Update html lang attribute
  document.documentElement.lang = lang;

  // Re-render all visible text
  applyLang();
}

function applyLang() {
  // Login page
  const labelEl = document.querySelector('#page-login .form-group:first-of-type label');
  if (labelEl) labelEl.textContent = t("loginLabel");
  const phoneInput = document.getElementById("input-id");
  if (phoneInput) phoneInput.placeholder = t("loginPlaceholder");
  const pinLabel = document.querySelector('#page-login .form-group:last-of-type label');
  if (pinLabel) pinLabel.textContent = t("pinLabel");
  const pinInput = document.getElementById("input-pin");
  if (pinInput) pinInput.placeholder = t("pinPlaceholder");
  const loginBtn = document.getElementById("btn-login");
  if (loginBtn && !loginBtn.disabled) loginBtn.textContent = t("loginBtn");
  const tagline = document.querySelector(".login-logo .tagline");
  if (tagline) tagline.textContent = t("loginTagline");
  const enTitle = document.querySelector(".login-logo .en-title");
  if (enTitle) enTitle.textContent = t("loginSubtitle");
  const logoutBtn = document.querySelector(".btn-logout");
  if (logoutBtn) logoutBtn.textContent = t("logoutBtn");

  // Student page
  const sub = document.querySelector("#page-student .page-subtitle");
  if (sub) sub.innerHTML = t("studentSubtitle");
  const adminTitle = document.querySelector("#page-admin .page-title");
  if (adminTitle) adminTitle.textContent = t("adminTitle");
  const adminSub = document.querySelector("#page-admin .page-subtitle");
  if (adminSub) adminSub.innerHTML = t("adminSubtitle");
  const phStudents = document.getElementById("ph-students");
  if (phStudents) phStudents.textContent = t("studentListHeader");
  const hint = document.getElementById("select-student-hint");
  if (hint) hint.textContent = t("selectStudent");
  const adminSubEl = document.getElementById("admin-subtitle-el");
  if (adminSubEl) adminSubEl.innerHTML = t("adminSubtitle");
  const initLoading = document.getElementById("initial-loading");
  if (initLoading) initLoading.childNodes[1].textContent = t("loadingContent");
}

// Override showError to use current lang
const _origShowError = window.showError;

(function init() {
  // Init language
  currentLang = localStorage.getItem(LANG_KEY) || "vi";
  ["vi","ja","en","fr"].forEach(l => {
    const btn = document.getElementById("lang-" + l);
    if (btn) btn.classList.toggle("active", l === currentLang);
  });
  document.documentElement.lang = currentLang;
  applyLang();

  showPage("login");
  const user = loadSession();
  if (user) initUser(user);
})();
</script>
</body>
</html>
